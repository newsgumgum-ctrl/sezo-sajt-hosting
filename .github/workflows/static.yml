# Objavljuje sajt iz sajt.zip na GitHub Pages.
# Za izmenu sajta samo ubacite (upload) novi sajt.zip u repozitorijum.
name: Objavi sajt

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raspakuj sajt.zip
        run: |
          mkdir _site
          unzip -q sajt.zip -d _site
          if [ ! -f _site/index.html ] && [ -f _site/sajt/index.html ]; then
            shopt -s dotglob; mv _site/sajt/* _site/; rmdir _site/sajt
          fi
          test -f _site/index.html
          ls _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
